name: Diagnóstico de Opinión de Valor (solo lectura)

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/opinion-valor-smoke.test.mjs'
      - '.github/workflows/portal-live-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opinion-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  opinion-readonly:
    name: Verificar acceso temporal de Opinión de Valor
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Obtener archivos del PR
        uses: actions/checkout@v4
      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Diagnosticar interfaz y API sin autenticar
        run: node --test tests/opinion-valor-smoke.test.mjs
