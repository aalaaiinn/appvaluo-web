name: Auditoría de interfaz Opinión de Valor (solo lectura)
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/opinion-valor/audit-frontend.mjs'
      - '.github/workflows/opinion-frontend-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/opinion-valor/audit-frontend.mjs
