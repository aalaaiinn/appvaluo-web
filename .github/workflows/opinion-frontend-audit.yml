name: Auditoría de interfaz Opinión de Valor (solo lectura)
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/opinion-valor/audit-frontend.mjs'
      - 'tools/opinion-valor/estilos-admin-predeploy.css'
      - 'tools/opinion-valor/validate-admin-responsive.mjs'
      - '.github/workflows/opinion-frontend-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/opinion-valor/audit-frontend.mjs

  visual:
    name: Comprobar administración con datos ficticios
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar navegador local de pruebas
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verificar panel sin datos reales
        run: node --test tools/opinion-valor/validate-admin-responsive.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opinion-admin-responsive-mock
          path: artifacts/opinion-admin-*.png
          if-no-files-found: ignore
          retention-days: 7
